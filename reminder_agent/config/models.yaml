# Tham số LLM theo từng vai của agent.
#
# Mỗi khối dưới `models:` được truyền thẳng vào ChatGoogleGenerativeAI(**khối),
# nên tên khoá phải đúng tên tham số của lớp đó. Viết đủ từng vai, không dùng
# defaults/kế thừa: thừa vài dòng nhưng nhìn một khối là biết vai đó chạy gì.
#
# Ở đây CHỈ để tham số không nhạy cảm. API key nằm trong .env, đọc qua
# app.core.config.settings — file này lên git, key thì không.
#
# Prompt không khai ở đây: prompt là file .md trong reminder_agent/prompts/, nơi
# dùng tự gọi load_prompt("<tên file>") rồi truyền vào create_google_genai().

models:
  # Trích đầu việc phải lặp lại y nhau giữa các lần chạy -> temperature 0
  extract:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 30
    max_retries: 2

  # Đọc ý định duyệt/từ chối, cũng cần ổn định
  decision:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 30
    max_retries: 2

  # Đọc ảnh / nghe tin nhắn thoại. Chép lại đúng nguyên văn nên temperature 0.
  # timeout gấp đôi các vai khác: một file thoại vài phút phải tải lên rồi mới
  # bắt đầu suy luận, 30s là chưa đủ cho lượt đó.
  media:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 60
    max_retries: 2

  # Hỏi đáp: diễn đạt tự nhiên hơn, và phải gọi tool rồi tổng hợp nên cho thêm
  # thời gian
  agent:
    model: gemini-2.5-flash
    temperature: 0.3
    timeout: 45
    max_retries: 2

# Tham số không phải của model, nên để ngoài khối `models:`
agent:
  # Số vòng gọi tool tối đa trước khi buộc trả lời bằng dữ liệu đã có.
  # Chặn vòng lặp agent <-> tools chạy mãi.
  max_tool_rounds: 3

  # Số message gần nhất được mang theo mỗi lượt hỏi đáp. Bot chỉ phục vụ một
  # chat_id nên thread không bao giờ đổi, lịch sử chỉ có tăng: không cắt thì
  # mỗi lượt lại gửi lại toàn bộ hội thoại từ ngày đầu.
  # Đếm theo SỐ MESSAGE, không phải token. Một vòng tra cứu tốn 2 message
  # (AIMessage tool_calls + ToolMessage), nên 20 ~ 5-6 lượt hỏi đáp có tra cứu.
  max_history_messages: 20
