# Tham số hành vi của agent. Đọc bởi TAR_agent/utils/config.py.
#
# Mỗi khối dưới `models:` splat thẳng vào ChatGoogleGenerativeAI(**khối) nên tên
# khoá phải đúng tên tham số của lớp đó.
#
# CHỈ để tham số không nhạy cảm ở đây — file này lên git, khoá thì không.
# Prompt cũng không khai ở đây: prompt là file .md trong prompts/.
#
# MỌI khối dưới đây đang chạy `gemini-2.5-flash`. KHÔNG có khối "lite" nào:
# `gemini-2.5-flash-lite` bị gỡ (vẫn hiện trong list_models nhưng
# generateContent trả 404 "no longer available to new users"), còn bản thay thế
# `gemini-3.5-flash-lite` thì chưa A/B trên tập câu hỏi thật nên chưa hạ tier
# khối nào. Hạ tier là lever độ trễ lớn nhất còn lại (-3 đến -5s) và cũng là
# lever dễ làm hỏng chất lượng nhất — đo trước, đổi sau.
#
# Ghim số bản chứ không dùng bí danh `gemini-flash-latest`: bí danh đổi model
# dưới chân mình mà không có gì báo, và chất lượng chọn dự án thì chỉ lộ ra khi
# bot trả lời nhầm dự án.
#
# `timeout` là lever của ĐUÔI, không phải của trung vị: một lời gọi treo giữ
# người dùng đúng bằng timeout rồi còn retry thêm hai lượt nữa. Đặt sát thời
# gian thật của chặng cộng biên độ, không đặt cho rộng rãi.

models:
  # Bot admin: liệt kê / xoá / thống kê. Dứt khoát, không cần sáng tạo.
  #
  # CHƯA AI ĐỌC khối này: graph_admin đi bằng router + interrupt, chưa có vòng
  # ReAct nào nên chưa gọi LLM (xem graph_admin/tools/__init__.py — ADMIN_TOOLS
  # còn rỗng). Giữ lại vì nó là tham số đã chốt cho lúc dựng agent admin.
  admin:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 30
    max_retries: 2

  identify:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 15
    max_retries: 2
    # ~6s cho một việc đáng lẽ nhanh — nhưng phần lớn là đọc prompt 6.9KB cộng
    # 20 message hội thoại, không phải nghĩ. Cấp vừa đủ để so tên dự án gõ sai
    # dấu với danh sách; nhiều hơn là trả tiền cho thời gian chờ.
    thinking_budget: 256

  # Chế độ QUYẾT ĐỊNH của node `agent`: lượt này có phải đi tra không. Đọc một
  # câu, trả một cờ — không cần nghĩ nhiều, nhưng nó nằm trên đường người dùng
  # đang ngồi chờ nên timeout ngắn.
  decide:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 15
    max_retries: 2
    thinking_budget: 256

  # Chế độ CHỌN LỌC của node `agent`: đọc vài chục dòng dữ liệu cạnh câu hỏi rồi
  # trả về chỉ số các dòng giữ lại. Đầu vào lớn nhất luồng sau `compose`, và
  # việc đối chiếu từng dòng với phạm vi câu hỏi là chỗ đáng cho ngân sách nghĩ.
  select:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 15
    max_retries: 2
    # 512 -> 256: đầu vào lớn nhưng đầu ra chỉ ~60 token (vài chỉ số + một dàn ý
    # hai câu). Ngân sách nghĩ ở đây trả tiền cho việc đối chiếu từng dòng với
    # phạm vi câu hỏi, không phải cho việc soạn chữ.
    thinking_budget: 256

  # KHÔNG đặt thinking_budget cho compose. Nó là cái bẫy đắt nhất trong file
  # này: compose viết kém hơn -> `grounding.check` ép verdict thành
  # "insufficient" -> một vòng revise -> +10s. Đổi 1.5s ở trung vị lấy 10s ở
  # đuôi là lỗ.
  # 45 -> 30, KHÔNG xuống nữa: đo được 8.5s cho câu trả lời liệt kê 31 dòng, mà
  # `sql_row_limit` cho phép tới 50. Đặt sát quá thì timeout giết đúng những lời
  # gọi đang chạy tốt, rồi retry hai lượt nữa — tệ hơn hẳn thứ nó định chữa.
  compose:
    model: gemini-2.5-flash
    temperature: 0.1
    timeout: 30
    max_retries: 2

  grade:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 20
    max_retries: 2
    # Đọc 5 đoạn, trả một danh sách số và một cờ — không có gì để nghĩ, mà nó
    # đang là ĐUÔI của nhánh tài liệu, tức là đuôi của cả node `retrieve`.
    thinking_budget: 0

  rewrite:
    model: gemini-2.5-flash
    temperature: 0.3
    timeout: 15
    max_retries: 2
    # Viết lại một câu hỏi ngắn — không cần nghĩ nhiều bằng client/sql.
    thinking_budget: 256

  extract:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 45
    max_retries: 2

  sql:
    model: gemini-2.5-flash
    temperature: 0.0
    timeout: 15
    max_retries: 2
    # Vài trăm token nghĩ trước khi sinh SQL — giúp với join/điều kiện nhiều
    # bảng mà không kéo độ trễ (đường người dùng đang ngồi chờ) lên nhiều.
    thinking_budget: 512

embedding:
  # text-embedding-004 đã bị gỡ khỏi API (404).
  model: models/gemini-embedding-001
  # Số văn bản mỗi lời gọi. Gemini có trần phía server; một file vài trăm chunk
  # gọi từng cái là chậm gấp bội và dễ dính rate limit.
  batch_size: 100
  # Số chiều KHÔNG khai ở đây: nó phải khớp cột VECTOR trong schema.sql, nên
  # nguồn duy nhất là EMBEDDING_DIM ở persistence/models/doc_chunk.py.
  # Khai hai nơi là sớm muộn lệch nhau mà không có lỗi nào nổ.

# Tầng truy xuất của bot client. Không có khoá nào ở đây là tham số của LLM.
retrieval:
  # Số đoạn mỗi nhánh lấy về TRƯỚC khi hợp nhất. Lấy dư rồi cắt còn `k`: RRF
  # chỉ xếp hạng lại được những gì hai nhánh đã đưa lên bàn.
  bm25_k: 5
  vector_k: 5
  # [bm25, vector]. Nghiêng về vector vì câu hỏi tiếng Việt hay diễn đạt khác
  # hẳn chữ trong file; BM25 giữ phần mã hiệu và tên riêng gõ đúng nguyên văn.
  weights: [0.4, 0.6]
  # Số đoạn thực sự đưa cho LLM sau khi hợp nhất.
  k: 5
  # Cosine distance. Trên ngưỡng này coi như lạc đề — thà trả rỗng còn hơn đưa
  # ba đoạn không liên quan cho model tán.
  max_distance: 0.6
  # Số lượt retrieve trong subgraph (lần đầu + tối đa 1 lần viết lại truy vấn).
  max_attempts: 2
  # Số dự án giữ chỉ mục BM25 trong RAM. Xem docs/plan-client-v2.md phần 2 mục 5.
  cache_projects: 8
  # Số lượt sinh/sửa SQL trong subgraph query_data (lần đầu + tối đa 1 lần sửa).
  max_sql_attempts: 2
  # Trần số dòng một câu SQL được trả về. `validate` ép LIMIT này vào câu nào
  # thiếu — không có nó thì một `SELECT *` trên file 500 dòng nhét cả bảng vào
  # prompt của compose.
  sql_row_limit: 50

# Trích dữ liệu có cấu trúc lúc nạp (node `extract` của graph admin).
extraction:
  # Số chunk .txt gộp vào MỘT lượt LLM. Lớn hơn thì rẻ hơn nhưng model bỏ sót
  # nhiều hơn ở cuối lô.
  batch_chunks: 8
  # Số lượt extract chạy song song. Gemini có rate limit phía server.
  max_concurrency: 3

agent:
  # Số message của `chat_history` đưa cho `identify_project`. Mỗi lượt chat ghi
  # ĐÚNG 2 message (câu hỏi + câu trả lời), nên 20 ~ 10 lượt hội thoại.
  #
  # Đây là chỗ DUY NHẤT còn cắt lịch sử: `messages` không đi tới model nào nữa
  # kể từ khi node `agent` biến mất.
  max_history_messages: 20
  # Trần TỔNG số lần vào node `retrieve` trong một lượt, kể cả lần quay lại từ
  # `compose`. Chặn cặp retrieve ⇄ compose ping-pong mãi khi compose không bao
  # giờ chấm "dat".
  max_iterations: 3
  # Số lần compose được phép đá ngược để tra bổ sung.
  #
  # 2 -> 1: vòng thứ hai gần như luôn vô ích. Hai subgraph ĐÃ tự viết lại truy
  # vấn / tự sửa SQL bên trong (max_attempts, max_sql_attempts), nên tới lúc
  # `compose` chê thiếu thì cả hai nhánh đều đã cạn cách tra. Vòng revise chỉ
  # còn giá trị ở đúng lần đầu, khi `missing` mang thông tin MỚI vào truy vấn.
  # Vòng thứ hai trả tiền cho hai lượt LLM để nhận lại gần đúng kết quả cũ.
  max_revise: 1

# Truyền thẳng vào RecursiveCharacterTextSplitter.
chunking:
  chunk_size: 1000
  # Chồng lấn: cắt đúng giữa một câu là cả hai chunk mất nghĩa.
  chunk_overlap: 200
